services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SUPABASE_URL=${SUPABASE_URL:-http://127.0.0.1:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ML_ENGINE_URL=http://ortools-engine:8001
    volumes:
      # バックエンドのソースコードをマウント
      - ./backend:/app
      
      - ./.env:/.env
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "
      if [ ! -f /.env ]; then
        cp /env.example /.env
      fi &&
      if [ \"$${ENVIRONMENT:-development}\" = \"development\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      fi"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_ENGINE_URL=http://localhost:8001
    volumes:
      # フロントエンドのソースコードをマウント
      - ./frontend:/app
      # node_modulesと.nextは除外（コンテナ内のものを使用）
      - /app/node_modules
      - /app/.next
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
      if [ ! -f /.env ]; then
        cp /env.example /.env
      fi &&
      if [ \"$${NODE_ENV:-development}\" = \"development\" ]; then
        npm run dev
      else
        npm start
      fi"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

  # OR-Tools最適化エンジン
  ortools-engine:
    build:
      context: ./ortools-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"  # ポート8001で公開
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_ROOMS=${MAX_ROOMS:-10}
      - MAX_SCENES=${MAX_SCENES:-20}
      - MAX_TIMESLOTS=${MAX_TIMESLOTS:-4}
      - MAX_PEOPLE=${MAX_PEOPLE:-60}
      - OPTIMIZATION_TIMEOUT=${OPTIMIZATION_TIMEOUT:-30}
    volumes:
      # ログファイルをマウント
      - ./ortools-engine/logs:/app/logs
      # 開発時のソースコードマウント（開発モードのみ）
      - ./ortools-engine/app:/app/app
      - ./ortools-engine/config:/app/config
      - ./ortools-engine/tests:/app/tests
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "
      if [ \"$${DEBUG:-false}\" = \"true\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
      fi"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/ml/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "project=tomosigoto-supabase"
      - "description=OR-Tools optimization engine for schedule optimization"

  # Optional: PostgreSQL for future database features
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: slidehub
      POSTGRES_USER: slidehub_user
      POSTGRES_PASSWORD: slidehub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
  default:
    name: tomosigoto-network
