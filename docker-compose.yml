version: '3.8'

services:
  tomosigoto-slidehub:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ppt-diff/app:/app/backend/ppt-diff/app
      - ./uploads:/tmp/ppt_uploads
    environment:
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - slidehub-network

  # Optional: PostgreSQL for future database features
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: slidehub
      POSTGRES_USER: slidehub_user
      POSTGRES_PASSWORD: slidehub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - slidehub-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - slidehub-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  slidehub-network:
    driver: bridge 