services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ORTOOLS_ENGINE_URL=http://ortools-engine:8001
    volumes:
      # バックエンドのソースコードをマウント
      - ./backend:/app
      - ./.env:/.env
    restart: unless-stopped
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_ORTOOLS_ENGINE_URL=http://localhost:8001
    volumes:
      # フロントエンドのソースコードをマウント
      - ./frontend:/app
      # node_modulesと.nextは除外（コンテナ内のものを使用）
      - /app/node_modules
      - /app/.next
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

networks:
  default:
    name: tomosigoto-network
