version: '3.8'

services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SUPABASE_URL=${SUPABASE_URL:-http://127.0.0.1:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ML_ENGINE_URL=http://ml-engine:8001
    volumes:
      # env.exampleと.envファイルをマウント
      - ./env.example:/env.example:ro
      - ./.env:/.env
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "
      cp /env.example /.env &&
      if [ \"$${ENVIRONMENT:-development}\" = \"development\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_ENGINE_URL=http://localhost:8001
    volumes:
      - /app/node_modules
      - /app/.next
      # env.exampleと.envファイルをマウント
      - ./env.example:/env.example:ro
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
      cp /env.example /.env &&
      if [ \"$${NODE_ENV:-development}\" = \"development\" ]; then
        yarn dev
      else
        yarn start
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

  # ML-Engine サービス
  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SUPABASE_URL=${SUPABASE_URL:-http://127.0.0.1:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PYTHONPATH=/app/src
    volumes:
      # モデルファイルと出力ファイルをマウント
      - ./ml-engine/models:/app/models
      - ./ml-engine/outputs:/app/outputs
      - ./ml-engine/logs:/app/logs
      - ./ml-engine/result:/app/result
      # 開発時のソースコードマウント（開発モードのみ）
      - ./ml-engine/src:/app/src
      - ./ml-engine/configs:/app/configs
      - ./ml-engine/scripts:/app/scripts
      # env.exampleと.envファイルをマウント
      - ./env.example:/env.example:ro
      - ./.env:/app/.env
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "
      if [ \"$${ENVIRONMENT:-development}\" = \"development\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
      fi"

    labels:
      - "project=tomosigoto-supabase"
      - "description=ML-Engine for schedule optimization"

  # Optional: PostgreSQL for future database features
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: slidehub
      POSTGRES_USER: slidehub_user
      POSTGRES_PASSWORD: slidehub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
    name: tomosigoto-network
