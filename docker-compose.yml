services:
  # PostgreSQL データベース
  postgres:
    container_name: tomosigoto-postgres-dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tomosigoto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tomosigoto}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tomosigoto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "project=tomosigoto"
      - "description=PostgreSQL database"

  # Nginx リバースプロキシ
  nginx:
    container_name: tomosigoto-nginx-dev
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - default
    labels:
      - "project=tomosigoto-supabase"
      - "description=Nginx reverse proxy"

  # FastAPI バックエンド
  backend:
    container_name: tomosigoto-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ORTOOLS_ENGINE_URL=http://ortools-engine:8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tomosigoto}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-tomosigoto}
    volumes:
      # バックエンドのソースコードをマウント
      - ./backend:/app
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    container_name: tomosigoto-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=${NODE_ENV:-development}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=/api/v1
        - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_ORTOOLS_ENGINE_URL=http://localhost:8001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      # フロントエンドのソースコードをマウント
      - ./frontend:/app
      # node_modulesと.nextは除外（コンテナ内のものを使用）
      - /app/node_modules
      - /app/.next
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

volumes:
  postgres_data:

networks:
  default:
    name: tomosigoto-network
