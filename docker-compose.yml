version: '3.8'

services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      # env.exampleと.envファイルをマウント
      - ./env.example:/env.example:ro
      - ./.env:/.env
    restart: unless-stopped
    command: >
      sh -c "
      cp /env.example /.env &&
      if [ \"$${ENVIRONMENT:-development}\" = \"development\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - /app/node_modules
      - /app/.next
      # env.exampleと.envファイルをマウント
      - ./env.example:/env.example:ro
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      - backend
    command: >
      sh -c "
      cp /env.example /.env &&
      if [ \"$${NODE_ENV:-development}\" = \"development\" ]; then
        yarn dev
      else
        yarn start
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

  # Optional: PostgreSQL for future database features
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: slidehub
      POSTGRES_USER: slidehub_user
      POSTGRES_PASSWORD: slidehub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - slidehub-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - slidehub-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
  slidehub-network:
    driver: bridge
  default:
    name: tomosigoto-network
