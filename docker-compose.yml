services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ORTOOLS_ENGINE_URL=http://ortools-engine:8001
    volumes:
      # バックエンドのソースコードをマウント
      - ./backend:/app
      
      - ./.env:/.env
    restart: unless-stopped
    command: >
      sh -c "
      if [ ! -f /.env ]; then
        cp /env.example /.env
      fi &&
      if [ \"$${ENVIRONMENT:-development}\" = \"development\" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_ORTOOLS_ENGINE_URL=http://localhost:8001
    volumes:
      # フロントエンドのソースコードをマウント
      - ./frontend:/app
      # node_modulesと.nextは除外（コンテナ内のものを使用）
      - /app/node_modules
      - /app/.next
      - ./.env:/.env
    restart: unless-stopped
    depends_on:
      - backend
    command: >
      sh -c "
      if [ ! -f /.env ]; then
        cp /env.example /.env
      fi &&
      if [ \"$${NODE_ENV:-development}\" = \"development\" ]; then
        npm run dev
      else
        npm start
      fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

networks:
  default:
    name: tomosigoto-network
