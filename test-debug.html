<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Debug</title>
</head>
<body>
    <h1>Supabase API テスト</h1>
    <div id="results"></div>

    <script>
        // Supabaseの設定（環境変数から取得する必要がある）
        async function testSupabaseAPI() {
            const resultsDiv = document.getElementById('results');

            // テスト1: stagesテーブルからデータを取得
            resultsDiv.innerHTML += '<h2>Test 1: Stages API</h2>';

            try {
                // Next.jsのAPIエンドポイント経由でテスト
                const response = await fetch('http://localhost:3000/api/test-stages');
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML += `<pre>Stages count: ${data.length}</pre>`;
                } else {
                    resultsDiv.innerHTML += `<pre>Error: ${response.status}</pre>`;
                }
            } catch (error) {
                resultsDiv.innerHTML += `<pre>Error: ${error.message}</pre>`;
            }
        }

        // ページ読み込み時に実行
        window.onload = testSupabaseAPI;
    </script>
</body>
</html>
