# 能の練習表作成システム 環境設定
# 場面ベースシステム対応

# 動的環境設定（学習時にランダムに変化）
# 固定最大値（観測・行動空間のサイズ）
max_rooms: 10               # 最大部屋数（行動空間の上限）
max_scenes: 30              # 最大場面数（行動空間の上限）
max_timeslots: 6            # 最大時間帯数（場面20÷部屋5の切り上げ）
max_people: 90              # 最大人数（観測空間の上限）

# 動的範囲（エピソードごとにランダム生成）
dynamic_ranges:
  scenes:
    min: 15                 # 場面数の最小値
    max: 30                 # 場面数の最大値
  rooms:
    min: 4                  # 部屋数の最小値
    max: 10                 # 部屋数の最大値
  people:
    min: 50                 # 人数の最小値
    max: 90                 # 人数の最大値
  # 時間帯数は自動計算：ceil(scenes / rooms)

session_duration: 60        # 基本セッション時間（分）
# 最大ステップ数（動的に調整）
max_steps: 100               # 設計上の上限に合わせて短縮

# 重複行動制御
max_action_history: 100      # 記憶する行動履歴数
repeat_action_penalty: -20.0 # 重複行動のペナルティ

# 監督者制約（無効化）
supervision_rules:
  # すべての部屋に監督者が必要
  require_supervisor_in_all_rooms: false  # 無効化
  
  # 監督者は自分のパートを監督できない
  prevent_self_supervision: false  # 無効化
  
  # 監督者の同時監督制限
  max_concurrent_rooms_per_supervisor: 999  # 制限なし
  
  # 監督者の優先順位（無効化）
  supervisor_priorities:
    "シテ": 1
    "ワキ": 1
    "舞囃子": 1

# 場面テンプレート（動的生成用）- 優先度削除
scene_templates:
  - name: "シテ"
    category: "役柄"
  - name: "ワキ"
    category: "役柄"
  - name: "地謡"
    category: "歌"
  - name: "笛"
    category: "楽器"
  - name: "小鼓"
    category: "楽器"
  - name: "大鼓"
    category: "楽器"
  - name: "太鼓"
    category: "楽器"
  - name: "舞囃子"
    category: "舞"
  - name: "謡"
    category: "歌"
  - name: "仕舞"
    category: "舞"
  - name: "囃子"
    category: "楽器"
  - name: "地拍子"
    category: "楽器"
  - name: "一調"
    category: "歌"
  - name: "二調"
    category: "歌"
  - name: "三調"
    category: "歌"
  - name: "四調"
    category: "歌"
  - name: "五調"
    category: "歌"
  - name: "六調"
    category: "歌"
  - name: "七調"
    category: "歌"
  - name: "八調"
    category: "歌"

# 動的場面生成設定
scene_generation:
  # 各エピソードで上記テンプレートからランダム選択
  # 複製なし、一意な場面のみ割り当て
  unique_scenes_only: true

# 人物参加設定
people_participation:
  # 1人あたりの参加場面数
  scenes_per_person: 3
  # 優先度（離散1..5）- 人の優先度を有効化
  priority_discrete: true  # 離散優先度（1-5）を有効化
  # 離散優先度の範囲（priority_discrete: trueの場合）
  priority_range:
    min: 1
    max: 5

# 部屋テンプレート（動的生成用）- 優先度削除
room_templates:
  - name: "大ホール"
    capacity: 30
  - name: "中ホール"
    capacity: 20
  - name: "練習室A"
    capacity: 15
  - name: "練習室B"
    capacity: 15
  - name: "練習室C"
    capacity: 15
  - name: "楽器練習室"
    capacity: 10
  - name: "小ホール"
    capacity: 12
  - name: "多目的室"
    capacity: 18
  - name: "稽古場"
    capacity: 25
  - name: "リハーサル室"
    capacity: 22

# 動的部屋生成設定
room_generation:
  # 各エピソードで上記テンプレートからランダム選択
  # 全場面対応、設備制約なし
  all_scenes_compatible: true

# 環境生成設定
environment_generator: "random"  # ランダム環境生成
seed: 45    # 固定シード値（再現性確保）
