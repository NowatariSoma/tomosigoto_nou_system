# 能の練習表作成システム 報酬設定
# シンプル化された報酬設計（監督・設備制約は無効化済み）

# 基本報酬
basic_rewards:
  new_assignment: 1.0        # 新規割り当ての報酬
  reassignment: -0.5         # 移動ペナルティを軽減
  repeat_action: -4.0        # 重複行動ペナルティを軽減
  step_penalty: -0.01        # ステップペナルティを大幅軽減

# 品質報酬
quality_rewards:
  time_efficiency: 0.0       # 定数シェーピング無効化

# 人物制約ペナルティ
person_constraints:
  person_conflict: -0.01     # 人物重複ペナルティを大幅軽減
  terminal_multiplier: 0.0
  priority_penalty_base: 1.0
  priority_penalty_factor: 0.0
  small_overlap_factor: 0.0  # 同一時間の人物重複ペナルティを無効化
  supervisor_conflict_penalty: -1.0  # 監督者重複ペナルティを追加（軽め）
  no_move_bonus_per_person: 3  # タイムスロットを跨いで同じ部屋に留まった人数あたりのボーナス

# 完了報酬
completion_rewards:
  scene_completion: 1.0      # 場面完了（増加で進捗促進）

# 報酬の重み付け
reward_weights:
  basic: 1.0
  quality: 1.0
  person_constraints: 1.0
  completion: 1.0
