version: '3.8'

services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    networks:
      - tomosigoto-network
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
        - SUPABASE_URL=${SUPABASE_URL}
        - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tomosigoto-network
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

networks:
  tomosigoto-network:
    driver: bridge