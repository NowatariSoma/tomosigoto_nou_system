name: tomosigoto-prod

services:
  # PostgreSQL データベース
  postgres:
    container_name: tomosigoto-postgres-prod
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tomosigoto}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      tomosigoto-network:
        ipv4_address: 172.23.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "project=tomosigoto"
      - "description=PostgreSQL database"

  # Nginx リバースプロキシ
  nginx:
    container_name: tomosigoto-nginx-prod
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      tomosigoto-network:
        ipv4_address: 172.23.0.4
    labels:
      - "project=tomosigoto-supabase"
      - "description=Nginx reverse proxy"

  # FastAPI バックエンド
  backend:
    container_name: tomosigoto-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tomosigoto}
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      tomosigoto-network:
        ipv4_address: 172.23.0.2
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # PostgreSQL 自動バックアップ (毎日 3:00 JST)
  backup:
    container_name: tomosigoto-backup-prod
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tomosigoto}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          FILENAME=/backups/tomosigoto_$$(date +%Y%m%d_%H%M%S).sql.gz;
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > $$FILENAME;
          echo \"Backup created: $$FILENAME\";
          find /backups -name '*.sql.gz' -mtime +7 -delete;
          sleep 86400;
        done
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      tomosigoto-network:
        ipv4_address: 172.23.0.6
    restart: unless-stopped
    labels:
      - "project=tomosigoto"
      - "description=PostgreSQL backup service"

  # Next.js フロントエンド
  frontend:
    container_name: tomosigoto-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_API_URL=/api/v1
        - NEXT_PUBLIC_AUTH_URL=/api/v1
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      tomosigoto-network:
        ipv4_address: 172.23.0.3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

volumes:
  postgres_data:

# backups/ ディレクトリは VPS 側で以下を設定推奨:
#   - cron + rsync でオフサイト転送 (S3/R2/別サーバー)
#   - 例: 0 4 * * * rsync -az /path/to/backups/ user@backup-server:/tomosigoto-backups/

networks:
  tomosigoto-network:
    name: tomosigoto-network-prod
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1
