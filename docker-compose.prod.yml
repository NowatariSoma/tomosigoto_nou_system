version: '3.8'

services:
  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    networks:
      tomosigoto-network:
        ipv4_address: 172.19.0.2
    labels:
      - "project=tomosigoto-supabase"
      - "description=FastAPI Backend with Supabase integration"

  # Next.js フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      - ./.env.production:/.env:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      tomosigoto-network:
        ipv4_address: 172.19.0.3
    labels:
      - "project=tomosigoto-supabase"
      - "description=Next.js Frontend with Supabase integration"

networks:
  tomosigoto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1