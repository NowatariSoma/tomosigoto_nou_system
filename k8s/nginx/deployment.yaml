apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: tomosigoto
data:
  # nginx の設定を ConfigMap で管理
  # docker-compose の volumes: ./nginx/nginx.prod.conf に相当
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream backend {
        server backend:8000;
      }
      upstream frontend {
        server frontend:3000;
      }
      server {
        listen 80;
        location /api/ {
          proxy_pass http://backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
          proxy_pass http://frontend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tomosigoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
