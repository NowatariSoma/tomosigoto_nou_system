name: Build & Package

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # バージョンタグでのリリース
  pull_request:
    branches: [ main, develop ]
  workflow_call:  # 他のワークフローから呼び出し可能
    outputs:
      artifact-name:
        description: "Build artifact name"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: python-package-${{ github.sha }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scmのため全履歴が必要
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-build-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools-scm
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
        python -m tarfile -l dist/*.tar.gz
        python -c "import zipfile; [print(f) for f in zipfile.ZipFile('dist/' + [f for f in __import__('os').listdir('dist/') if f.endswith('.whl')][0]).namelist()]"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-${{ github.sha }}
        path: dist/
        retention-days: 30

  test-package:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Java (for Apache Tika)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-${{ github.sha }}
        path: ./dist/
    
    - name: Test wheel installation
      run: |
        pip install dist/*.whl
        git config --global user.name "CI Test User"
        git config --global user.email "ci@example.com"
    
    - name: Test installed package
      run: |
        git-ppt version
        git-ppt help
        mkdir test-repo
        cd test-repo
        git init
        git-ppt install --local
        git-ppt env
    
    - name: Test sdist installation
      run: |
        pip uninstall -y git-ppt
        pip install dist/*.tar.gz
        git-ppt version 