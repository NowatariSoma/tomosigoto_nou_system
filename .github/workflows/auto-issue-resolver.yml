name: Auto Issue Resolver
on:
  schedule:
    # JST 23:00-06:00の間、30分ごとに実行
    # JST = UTC + 9時間
    # JST 23:00 = UTC 14:00, JST 06:00 = UTC 21:00
    - cron: '0,30 14-20 * * *'  # UTC 14:00-20:30 (JST 23:00-05:30)
    - cron: '0 21 * * *'        # UTC 21:00 (JST 06:00)
  workflow_dispatch: # 手動実行も可能
jobs:
  process-issue:
    runs-on: ubuntu-latest
    
    steps:
      - name: Find and process highest priority issue
        uses: actions/github-script@v7
        with:
          # 必ずPersonal Access Tokenを使用
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            // 優先度順にissueを探す（ラベルなしも含む）
            const priorities = ['high', 'middle', 'low', 'no-priority'];
            const processedLabel = 'claude-code-requested';
            
            for (const priority of priorities) {
              let issues;
              
              if (priority === 'no-priority') {
                // 優先度ラベルがないissueを取得
                const allOpenIssues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  sort: 'created',
                  direction: 'asc',  // 古い順に変更
                  per_page: 100
                });
                
                // high, middle, lowのいずれのラベルも持たないissueをフィルタ
                issues = {
                  data: allOpenIssues.data.filter(issue => 
                    !issue.labels.some(label => 
                      ['high', 'middle', 'low', processedLabel].includes(label.name)
                    )
                  )
                };
              } else {
                // 特定の優先度ラベルがついたissueを取得
                issues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: priority,
                  state: 'open',
                  sort: 'created',
                  direction: 'asc',  // 古い順に変更
                  per_page: 100
                });
              }
              
              // 未処理のissueを探す
              const unprocessedIssue = issues.data.find(issue => 
                !issue.labels.some(label => label.name === processedLabel)
              );
              
              if (unprocessedIssue) {
                // 優先度の表示を調整
                const priorityText = priority === 'no-priority' ? '優先度: 未設定' : `優先度: ${priority}`;
                
                // @claudeメンションコメントを投稿
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: unprocessedIssue.number,
                  body: [
                    `@claude このIssue #${unprocessedIssue.number} を解決してください。`,
                    '',
                    '以下の内容に基づいて、具体的な実装方針を考え実装してください。実装が終わり次第ブランチを切りプルリクエストを作成し、そこに対してコミットしてください：',
                    '',
                    `**タイトル**: ${unprocessedIssue.title}`,
                    '',
                    '**説明**:',
                    unprocessedIssue.body || '説明なし',
                    '',
                    priorityText
                  ].join('\n')
                });
                
                // 処理済みラベルを追加
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: unprocessedIssue.number,
                  labels: [processedLabel]
                });
                
                console.log(`Processed issue #${unprocessedIssue.number} (${priority})`);
                console.log('Claude Code Action will be triggered by the mention');
                return; // 1つのissueのみ処理して終了
              }
            }
            
            console.log('No unprocessed issues found');
