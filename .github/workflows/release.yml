name: Release

on:
  push:
    tags:
      - 'v*'  # バージョンタグ（v1.0.0など）でのみ実行
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write  # リリース作成に必要
  packages: write  # パッケージ公開に必要

jobs:
  # ビルドワークフローを再利用
  build:
    uses: ./.github/workflows/build.yml
    
  # テストワークフローを再利用
  test:
    uses: ./.github/workflows/test.yml
    
  # リントワークフローを再利用
  lint:
    uses: ./.github/workflows/lint.yml

  # リリース作成とパッケージ公開
  release:
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      if: env.PYPI_API_TOKEN != ''
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        password: ${{ secrets.PYPI_API_TOKEN }}
    
    - name: Publish to Test PyPI
      if: env.TEST_PYPI_API_TOKEN != ''
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  # リリース後の通知
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [github-release, pypi-release]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.github-release.result == 'success' && needs.pypi-release.result == 'success'
      run: |
        echo "🎉 Release ${{ github.ref_name }} published successfully!"
        echo "- GitHub Release: ✅"
        echo "- PyPI Release: ✅"
    
    - name: Notify failure
      if: needs.github-release.result == 'failure' || needs.pypi-release.result == 'failure'
      run: |
        echo "❌ Release ${{ github.ref_name }} failed!"
        echo "- GitHub Release: ${{ needs.github-release.result }}"
        echo "- PyPI Release: ${{ needs.pypi-release.result }}"
        exit 1 