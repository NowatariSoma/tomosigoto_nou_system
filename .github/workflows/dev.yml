name: Development

on:
  push:
    branches: [ develop, feature/* ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # 手動実行可能

jobs:
  quick-check:
    name: Quick Development Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-dev-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-dev-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .  # Install package in development mode

    - name: Quick syntax check
      run: |
        python -m py_compile src/*.py
        python -m py_compile tests/*.py
    
    - name: Run basic tests
      run: |
        python -m pytest tests/test_extractor.py -v
        python -m pytest tests/test_diff.py::TestPPTXDiffer::test_init -v
    
    - name: Check imports
      run: |
        python -c "from src.pptx_extractor import PPTXExtractor"
        python -c "from src.diff import PPTXDiffer"
        python -c "from src.cli import main"

  comprehensive-test:
    name: Comprehensive Development Test
    runs-on: ubuntu-latest
    needs: quick-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        python-version: [3.8, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Java (for Apache Tika)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .  # Install package in development mode

    - name: Run comprehensive tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Test CLI functionality
      run: |
        python -m src.cli version
        python -m src.cli help
    
    - name: Test package building
      run: |
        python -m build
        ls -la dist/
    
    - name: Test package installation
      run: |
        pip install dist/*.whl
        git-ppt version
        git-ppt help

  development-build:
    name: Development Build Test
    runs-on: ubuntu-latest
    needs: quick-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools-scm
    
    - name: Build development package
      run: |
        python -m build
    
    - name: Upload development artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dev-package-${{ github.sha }}
        path: dist/
        retention-days: 7 