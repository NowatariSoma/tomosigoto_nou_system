name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 並列実行される基本チェック
  tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  code-quality:
    name: Code Quality
    uses: ./.github/workflows/lint.yml

  # テストとリンティングが成功後にビルド
  build:
    name: Build Package
    needs: [tests, code-quality]
    uses: ./.github/workflows/build.yml

  # 全体の成功を示すジョブ
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [tests, code-quality, build]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "Tests: ${{ needs.tests.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Build: ${{ needs.build.result }}"
        
        if [[ "${{ needs.tests.result }}" != "success" || "${{ needs.code-quality.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
          echo "❌ CI failed"
          exit 1
        else
          echo "✅ All CI jobs passed successfully!"
        fi

  # プルリクエスト用のサマリーコメント
  pr-comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [tests, code-quality, build]
    if: github.event_name == 'pull_request' && always()
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        script: |
          const tests = '${{ needs.tests.result }}';
          const quality = '${{ needs.code-quality.result }}';
          const build = '${{ needs.build.result }}';
          
          let status = '✅ All checks passed!';
          let emoji = '🎉';
          
          if (tests !== 'success' || quality !== 'success' || build !== 'success') {
            status = '❌ Some checks failed';
            emoji = '⚠️';
          }
          
          const body = `## ${emoji} CI Summary
          
          | Check | Status |
          |-------|--------|
          | Tests | ${tests === 'success' ? '✅' : '❌'} ${tests} |
          | Code Quality | ${quality === 'success' ? '✅' : '❌'} ${quality} |
          | Build | ${build === 'success' ? '✅' : '❌'} ${build} |
          
          ${status}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          }); 